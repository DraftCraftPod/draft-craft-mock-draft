name: Refresh live draft order and records

on:
  schedule:
    - cron: "0 12 * * *"  # every day at 12:00 UTC (8 AM Eastern in fall, 7 AM in winter)
  workflow_dispatch:       # "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Tankathon order and ESPN records
        run: python3 scripts/refresh_live.py
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh live draft data"
            git push
          fi
